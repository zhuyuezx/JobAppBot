[project]
name = "jobfilter"
version = "0.1.0"
description = "Fetch, filter and collect hiring.cafe job postings"
requires-python = ">=3.9"
dependencies = [
    "curl_cffi>=0.7",
    "openpyxl>=3.1",
    "jsonschema>=4.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobFilter"]
include-package-data = true

[tool.setuptools.package-data]
jobFilter = ["static/*.html", "static/*.js", "static/*.css"]
